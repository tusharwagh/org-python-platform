[project]
name = "agent-desk-starter"
version = "0.1.0"
description = "LangGraph HITL desk primitives — SOP graph, session store, privacy helpers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_desk"]
