[project]
name = "langfuse-tracing"
version = "0.1.0"
description = "Langfuse spans and structured audit logging for agentic apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "structlog>=24.0.0",
]

[project.optional-dependencies]
langfuse = ["langfuse>=2.0.0"]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langfuse_tracing"]
